[project]
name = "paper-radar"
version = "0.1.0"
description = "Pull recent papers on a topic from Crossref and ask questions about them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0.12",
  "flask>=3.0.0",
  "openai>=1.60.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.scripts]
papers = "papers:main"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["papers", "web"]
